apiVersion: apps/v1
kind: Deployment
metadata:
  name: camunda-worker
  namespace: apisix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camunda-worker
  template:
    metadata:
      labels:
        app: camunda-worker
    spec:
      containers:
      - name: camunda-worker
        image: camunda-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        # Camunda 配置
        - name: CAMUNDA_AUTH_STRATEGY
          value: "BASIC"
        - name: CAMUNDA_BASIC_AUTH_USERNAME
          value: "demo"
        - name: CAMUNDA_BASIC_AUTH_PASSWORD
          value: "demo"
        - name: CAMUNDA_SECURE_CONNECTION
          value: "false"
        - name: CAMUNDA_REST_ADDRESS
          value: "http://camunda-rest.camunda.svc.cluster.local:8080"
        - name: CAMUNDA_LOG_LEVEL
          value: "info"
        # RustFS 配置
        - name: RUSTFS_ENDPOINT_URL
          value: "http://rustfs.rustfs.svc.cluster.local:9000"
        - name: RUSTFS_ACCESS_KEY_ID
          value: "rustfsadmin"
        - name: RUSTFS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-secret
              key: secret-key
        - name: RUSTFS_BUCKETNAME
          value: "ywmast"
        # PDF 服务配置（需要修改为 k8s 内部地址）
        - name: PDF_SERVICE_URL
          value: "http://pdf-service.pdf.svc.cluster.local:8080/api/pdf"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # 健康检查
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f 'node dist/index.js' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f 'node dist/index.js' || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secret
  namespace: apisix
type: Opaque
stringData:
  secret-key: "rustfsadmin"
