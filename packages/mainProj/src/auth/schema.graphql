  pageInfo: PageInfo
}

type UnitConnectionEdge {
  cursor: String
  node: Unit
}

union UnitEs = CompanyEs | PersonEs

type UnitEsConnection {
  edges: [UnitEsConnectionEdge]
  pageInfo: PageInfo
}

type UnitEsConnectionEdge {
  cursor: String
  node: UnitEs
}

input UnitInputPorjection {
  cancel: Boolean
  indCod: String
}

type User implements Uunode & Node & UserBase {
  id: ID!
  username: String!
  mobile: String
  person: Person
  authName: String
  authType: String

  """
   checks: [Isp]  可能20万条
  isp: IspConnection    #可能2万条
  底下这个isps_list 淘汰！不要用。
  isps_list(first:Int,after:String,last:Int,before:String): IspConnection @dbpage
  权限表非超级用户只能看自己的了
  """
  authorities: [Authority]

  """模型字段实际同函数一样的处理,属性竟然也可以有输入参数"""
  enabled(isUsing: Boolean): Boolean!
  photoURL: String
  unit: Unit
  dep: Division
  office: Office
  ispUnits: [IspAgency]
}

interface UserBase {
  id: ID!
  username: String!
  mobile: String
  person: Person
  unit: Unit
  dep: Division
  office: Office
}

input UserCommonInput {
  id: ID
  no: String
  name: String
  addr: String
  phone: String
}

type UserConnection {
  edges: [UserConnectionEdge]
  pageInfo: PageInfo
}

type UserConnectionEdge {
  cursor: String
  node: User
}

type UserTask {
  id: ID!
  processName: String!
  tdId: String!
  ent: String
  pren: String
  name: String!
  assignee: String
  candidateGroups: [String!]
  creationTime: String
  uri: String
  expirationDate: String
  topic: String
  prId: String
  say: String
}

type UserTaskConnection {
  edges: [UserTaskConnectionEdge]
  pageInfo: PageInfo
}

type UserTaskConnectionEdge {
  cursor: String
  node: UserTask
}

