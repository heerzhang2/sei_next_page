version: '3.8'

services:
  app:
    build: .
    ports:
      - "3765:3765"
    environment:
      - NODE_ENV=production
      - PORT=3765
    volumes:
      - ./ssl:/app/ssl:ro
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - app
    restart: unless-stopped
