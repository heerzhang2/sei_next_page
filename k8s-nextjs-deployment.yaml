apiVersion: apps/v1
kind: Deployment
metadata:
  name: sei-nextjs
  namespace: seirep
  labels:
    app: sei-nextjs
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sei-nextjs
  template:
    metadata:
      labels:
        app: sei-nextjs
        version: v1
    spec:
      imagePullSecrets:
      - name: aliyun-registry
      containers:
      - name: sei-nextjs
        image: crpi-lr1czs92lrq7vzhm.cn-shanghai.personal.cr.aliyuncs.com/sei-rearend/sei-nextjs:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3765
          protocol: TCP
        env:
        # TLS 配置
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"

        # Next.js 配置
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_BASE_PATH
          value: "/report"

        # Camunda 8 K3s 集群配置
        - name: CAMUNDA_REST_ADDRESS
          value: "http://camunda-zeebe-gateway.orchestration.svc.cluster.local:8080"
        - name: CAMUNDA_AUTH_STRATEGY
          value: "BASIC"
        - name: CAMUNDA_BASIC_AUTH_USERNAME
          value: "demo"
        - name: CAMUNDA_BASIC_AUTH_PASSWORD
          value: "demo"

        # Redis 配置
        - name: REDIS_HOST
          value: "192.168.109.66"
        - name: REDIS_PORT
          value: "31379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sei-nextjs-secrets
              key: redis-password

        # PDF 服务配置
        - name: PDF_SERVICE_URL
          value: "http://page2pdf-server.seirep.svc.cluster.local:9389"
        - name: PDF_SERVICE_TOKEN
          value: "YWRtaW46Q2VyNmpzJGt3OWUwV2E="

        # NextAuth 配置
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: sei-nextjs-secrets
              key: nextauth-secret
        - name: NEXTAUTH_URL
          value: "https://192.168.109.66:30443"
        - name: AUTH_TRUST_HOST
          value: "true"

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          tcpSocket:
            port: 3765
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3765
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sei-nextjs
  namespace: seirep
  labels:
    app: sei-nextjs
spec:
  type: ClusterIP
  selector:
    app: sei-nextjs
  ports:
  - name: http
    port: 3765
    targetPort: 3765
    protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: sei-nextjs-secrets
  namespace: seirep
type: Opaque
stringData:
  redis-password: "Kh_dfg4jwq0o9f!sdUa"
  nextauth-secret: "eue87dfdf00474vhdgHSWhfjfdsf2348"
