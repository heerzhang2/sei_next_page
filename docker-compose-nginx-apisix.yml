
services:
  # Nginx 反向代理服务
  nginx:
    image: nginx:alpine
    container_name: nginx-apisix
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - ./nginx-apisix.conf:/etc/nginx/conf.d/apisix.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - example_apisix
    external_links:
      - example-apisix-1:apisix
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  example_apisix:
    external: true
