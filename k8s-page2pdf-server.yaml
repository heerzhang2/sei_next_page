apiVersion: apps/v1
kind: Deployment
metadata:
  name: page2pdf-server
  namespace: seirep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: page2pdf-server
  template:
    metadata:
      labels:
        app: page2pdf-server
    spec:
      imagePullSecrets:
      - name: aliyun-registry
      containers:
        - name: page2pdf-server
          image: crpi-lr1czs92lrq7vzhm.cn-shanghai.personal.cr.aliyuncs.com/sei-rearend/page2pdf-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9389
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_USE_SYSTEM_CA
              value: "1"
            - name: PORT
              value: "9389"
            - name: CHROME_PATH
              value: "/usr/bin/chromium-browser"
            - name: OUTPUT_PATH
              value: "/app/output"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: output-data
              mountPath: /app/output
      volumes:
        - name: output-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: page2pdf-server
  namespace: seirep
spec:
  selector:
    app: page2pdf-server
  ports:
    - port: 9389
      targetPort: 9389
      name: http
  type: ClusterIP
