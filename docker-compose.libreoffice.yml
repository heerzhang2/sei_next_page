version: '3.8'

services:
  # 主应用服务（包含 LibreOffice UNO）
  app:
    build:
      context: .
      dockerfile: Dockerfile.libreoffice
    container_name: sei-oa-app
    ports:
      - "3000:3000"      # Next.js 应用端口
      - "2002:2002"      # LibreOffice UNO 套接字端口（可选，用于调试）
    environment:
      NODE_ENV: production
      # 数据库连接等其他环境变量
      DATABASE_URL: "mysql://user:password@db:3306/database"
      # LibreOffice 相关（可选）
      LIBREOFFICE_HOST: "127.0.0.1"
      LIBREOFFICE_PORT: "2002"
    volumes:
      # 临时文件目录
      - /tmp:/tmp
      # 可选：持久化 LibreOffice 配置
      - libreoffice_config:/root/.config/libreoffice
    depends_on:
      # 根据需要依赖其他服务（如数据库）
      # - db
      - redis
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 服务（可选，用于会话、缓存、Bull MQ 队列）
  redis:
    image: redis:7-alpine
    container_name: sei-oa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 数据库服务（根据需要）
  # db:
  #   image: mysql:8.0
  #   container_name: sei-oa-db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root_password
  #     MYSQL_DATABASE: database
  #     MYSQL_USER: user
  #     MYSQL_PASSWORD: password
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   restart: unless-stopped

volumes:
  libreoffice_config:
  redis_data:
  # db_data:

networks:
  default:
    name: sei-oa-network
